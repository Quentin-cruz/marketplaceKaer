<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil vendeur — Kaer Seller</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.profil-hero {
  background: var(--green);
  padding: clamp(2rem, 5vw, 3rem) clamp(1rem, 4vw, 3rem);
  display: flex;
  align-items: center;
  gap: 1.5rem;
  flex-wrap: wrap;
}
.profil-hero-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: rgba(255,255,255,.2);
  color: #fff;
  font-family: var(--font-serif);
  font-size: 1.8rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,.35);
}
.profil-hero-info { flex: 1; min-width: 0; }
.profil-hero-name {
  font-family: var(--font-serif);
  font-size: clamp(1.3rem, 3vw, 1.8rem);
  color: #fff;
  margin-bottom: 0.2rem;
}
.profil-hero-meta { font-size: 13px; color: rgba(255,255,255,.65); }

.profil-hero-stats { display: flex; gap: 1.5rem; flex-wrap: wrap; }
.profil-stat { text-align: center; color: #fff; }
.profil-stat-value { font-family: var(--font-serif); font-size: 1.6rem; line-height: 1; }
.profil-stat-label { font-size: 11px; color: rgba(255,255,255,.6); margin-top: 2px; }

.vendeur-page {
  max-width: 900px;
  margin: 0 auto;
  padding: clamp(1.5rem, 4vw, 2.5rem) clamp(1rem, 4vw, 2rem);
}

.section-title {
  font-family: var(--font-serif);
  font-size: 1.2rem;
  margin-bottom: 1.2rem;
  padding-bottom: 0.8rem;
  border-bottom: 1px solid var(--border);
}

/* GRILLE ANNONCES (reprise de marketplace) */
.vendeur-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 1.2rem;
}

.product-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  transition: box-shadow 0.2s, transform 0.2s;
}
.product-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }

.product-img {
  aspect-ratio: 4/3;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  overflow: hidden;
  position: relative;
}
.product-body { padding: 1rem; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.product-meta { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.product-name { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.4; }
.product-price { font-family: var(--font-serif); font-size: 1rem; color: var(--brown); font-weight: 700; margin-top: 4px; }

/* AVIS */
.avis-header {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 1.2rem;
  padding-bottom: 0.8rem;
  border-bottom: 1px solid var(--border);
}
.avis-moyenne {
  font-family: var(--font-serif);
  font-size: 2rem;
  color: var(--brown);
  line-height: 1;
}
.avis-etoiles { color: #f59e0b; font-size: 1.1rem; letter-spacing: 2px; }
.avis-total { font-size: 13px; color: var(--muted); }

.avis-list { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }

.avis-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.2rem;
}
.avis-item-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.4rem;
  flex-wrap: wrap;
  gap: 6px;
}
.avis-item-auteur { font-size: 13px; font-weight: 600; color: var(--text); }
.avis-item-date   { font-size: 12px; color: var(--muted); }
.avis-item-note   { color: #f59e0b; font-size: 0.95rem; }
.avis-item-text   { font-size: 13px; color: var(--text2); line-height: 1.6; margin-top: 4px; }

/* FORMULAIRE AVIS */
.avis-form {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.2rem 1.5rem;
}
.avis-form-title { font-size: 14px; font-weight: 600; margin-bottom: 1rem; color: var(--text); }

.star-picker { display: flex; gap: 6px; margin-bottom: 1rem; }
.star-picker span {
  font-size: 1.6rem;
  cursor: pointer;
  color: var(--border2);
  transition: color 0.1s;
  line-height: 1;
}
.star-picker span.active { color: #f59e0b; }

.empty-state { text-align: center; padding: 3rem 2rem; color: var(--muted); }

@media (max-width: 600px) {
  .profil-hero { flex-direction: column; align-items: flex-start; }
  .vendeur-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="navbar-logo" href="marketplace.html">
    <span class="navbar-logo-icon">⬡</span>
    Kaer Seller
  </a>
  <div class="navbar-nav">
    <a class="nav-link" href="marketplace.html">Catalogue</a>
    <a class="nav-link" href="mes-achats.html">Mes achats</a>
    <a class="nav-link" href="mes-annonces.html">Mes annonces</a>
    <span class="nav-link-wrap"><a class="nav-link" href="messages.html">Messages</a><span class="nav-badge" id="msg-badge"></span></span>
  </div>
  <div class="navbar-actions">
    <div class="navbar-search">
      <svg class="navbar-search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="13" y1="13" x2="18" y2="18"/></svg>
      <input type="search" placeholder="Rechercher un produit…">
    </div>
    <div class="avatar-wrap">
      <div class="avatar" id="nav-avatar" onclick="toggleDropdown()" style="cursor:pointer"></div>
      <div class="avatar-dropdown" id="avatar-dropdown">
        <div class="avatar-dropdown-header">
          <span class="avatar-dropdown-name" id="dd-name"></span>
          <span class="avatar-dropdown-email" id="dd-email"></span>
        </div>
        <a class="avatar-dropdown-item" href="profil.html">👤 Mon profil</a>
        <a class="avatar-dropdown-item" href="mes-annonces.html">📋 Mes annonces</a>
        <a class="avatar-dropdown-item" href="favoris.html">🤍 Favoris</a>
        <div class="avatar-dropdown-sep"></div>
        <button class="avatar-dropdown-item danger" onclick="logout()">↩ Se déconnecter</button>
      </div>
    </div>
  </div>
  <button class="hamburger" onclick="toggleMobileNav()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="mobile-nav" id="mobile-nav">
  <a class="nav-link" href="marketplace.html">Catalogue</a>
  <a class="nav-link" href="mes-achats.html">Mes achats</a>
  <a class="nav-link" href="mes-annonces.html">Mes annonces</a>
  <a class="nav-link" href="messages.html">Messages</a>
</div>

<!-- HERO -->
<div class="profil-hero">
  <div class="profil-hero-avatar" id="hero-avatar"></div>
  <div class="profil-hero-info">
    <div class="profil-hero-name" id="hero-name">Chargement…</div>
    <div class="profil-hero-meta" id="hero-meta"></div>
  </div>
  <div class="profil-hero-stats">
    <div class="profil-stat">
      <div class="profil-stat-value" id="stat-annonces">—</div>
      <div class="profil-stat-label">annonces</div>
    </div>
  </div>
</div>

<!-- CONTENU -->
<div class="vendeur-page">
  <div id="vendeur-bio" style="display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.2rem 1.5rem;margin-bottom:1.5rem;font-size:14px;color:var(--text2);line-height:1.7;"></div>

  <div class="section-title">Annonces publiées</div>
  <div id="vendeur-grid" style="margin-bottom:2.5rem;"></div>

  <div class="section-title" id="avis-section-title">Avis</div>
  <div id="avis-header-block" style="margin-bottom:1rem;"></div>
  <div class="avis-list" id="avis-list"></div>
  <div id="avis-form-wrap"></div>
</div>

<script src="auth-guard.js"></script>
<script>
var _moi = null;
var _vendeurId = null;
var _noteSelectionnee = 0;

(async function() {
  var user = await requireAuth();
  _moi = user;
  await initNav(user);
  await chargerVendeur();
})();

function toggleMobileNav() {
  document.getElementById('mobile-nav').classList.toggle('open');
}

async function chargerVendeur() {
  var id = new URLSearchParams(window.location.search).get('id');
  if (!id) return;

  try {
    var res  = await fetch(API + '/users/' + id, { credentials: 'include' });
    if (!res.ok) { document.getElementById('hero-name').textContent = 'Vendeur introuvable'; return; }
    var data = await res.json();

    var initiales = data.raison_sociale.split(' ').slice(0, 2).map(function(w) { return w[0]; }).join('').toUpperCase();
    document.getElementById('hero-avatar').textContent   = initiales;
    document.getElementById('hero-name').textContent     = data.raison_sociale;
    document.getElementById('stat-annonces').textContent = data.nb_annonces;
    document.title = data.raison_sociale + ' — Kaer Seller';

    if (data.bio) {
      var bioEl = document.getElementById('vendeur-bio');
      bioEl.textContent = data.bio;
      bioEl.style.display = 'block';
    }

    var meta = [];
    if (data.ville)  meta.push(data.ville);
    if (data.region) meta.push(data.region);
    meta.push('Membre depuis ' + new Date(data.created_at).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }));
    document.getElementById('hero-meta').textContent = meta.join(' · ');

    var grid = document.getElementById('vendeur-grid');
    if (!data.annonces.length) {
      grid.innerHTML = '<div class="empty-state">Aucune annonce publiée pour l\'instant.</div>';
      return;
    }

    _vendeurId = data.id;
    await chargerAvis(data.id);
    if (_moi && _moi.id !== data.id) await verifierEtAfficherFormulaireAvis(data.id);

    grid.className = 'vendeur-grid';
    grid.innerHTML = data.annonces.map(function(p) {
      var imgs   = p.images ? JSON.parse(p.images) : [];
      var imgHtml = imgs.length
        ? '<img src="/uploads/' + imgs[0] + '" alt="" style="width:100%;height:100%;object-fit:cover;">'
        : '🏇';
      var prix = p.prix_ht
        ? parseFloat(p.prix_ht).toLocaleString('fr-FR') + ' €'
        : 'Sur devis';
      return '<a class="product-card" href="product.html?id=' + p.id + '">'
        + '<div class="product-img">' + imgHtml + '</div>'
        + '<div class="product-body">'
        + '<div class="product-meta">' + p.categorie + '</div>'
        + '<div class="product-name">' + escHtml(p.titre) + '</div>'
        + '<div class="product-price">' + prix + '</div>'
        + '</div></a>';
    }).join('');
  } catch {
    document.getElementById('hero-name').textContent = 'Erreur de chargement.';
  }
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function etoiles(note, total) {
  var s = '';
  for (var i = 1; i <= 5; i++) s += i <= Math.round(note) ? '★' : '☆';
  return s;
}

async function chargerAvis(vendeurId) {
  try {
    var res  = await fetch(API + '/avis/' + vendeurId, { credentials: 'include' });
    var data = await res.json();

    var header = document.getElementById('avis-header-block');
    if (data.total > 0) {
      var moy = parseFloat(data.moyenne).toFixed(1);
      header.innerHTML = '<div class="avis-header">'
        + '<div class="avis-moyenne">' + moy + '</div>'
        + '<div><div class="avis-etoiles">' + etoiles(moy) + '</div>'
        + '<div class="avis-total">' + data.total + ' avis</div></div>'
        + '</div>';
    }

    var list = document.getElementById('avis-list');
    if (!data.avis.length) {
      list.innerHTML = '<div style="font-size:13px;color:var(--muted);margin-bottom:1rem;">Aucun avis pour l\'instant.</div>';
    } else {
      list.innerHTML = data.avis.map(function(a) {
        var date = new Date(a.created_at).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
        return '<div class="avis-item">'
          + '<div class="avis-item-header">'
          + '<span class="avis-item-auteur">' + escHtml(a.auteur_nom) + '</span>'
          + '<span class="avis-item-note">' + etoiles(a.note) + '</span>'
          + '<span class="avis-item-date">' + date + '</span>'
          + '</div>'
          + (a.commentaire ? '<div class="avis-item-text">' + escHtml(a.commentaire) + '</div>' : '')
          + '</div>';
      }).join('');
    }
  } catch { /* silencieux */ }
}

async function verifierEtAfficherFormulaireAvis(vendeurId) {
  try {
    var res  = await fetch(API + '/transactions/avec/' + vendeurId, { credentials: 'include' });
    var data = await res.json();
    if (data.transactionExiste) {
      // monRole = 'acheteur' → j'ai acheté → j'évalue un vendeur
      // monRole = 'vendeur'  → j'ai vendu  → j'évalue un acheteur
      var contexte = data.monRole === 'acheteur'
        ? { titre: 'Évaluer ce vendeur', placeholder: 'Décrivez votre expérience d\'achat : sérieux, qualité des produits, réactivité…' }
        : { titre: 'Évaluer cet acheteur', placeholder: 'Décrivez votre expérience : sérieux, communication, respect des engagements…' };
      afficherFormulaireAvis(vendeurId, contexte);
    } else {
      document.getElementById('avis-form-wrap').innerHTML =
        '<div style="font-size:13px;color:var(--muted);padding:0.8rem 1rem;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);">'
        + 'Vous devez avoir effectué une transaction avec cette personne pour laisser un avis.'
        + '</div>';
    }
  } catch { /* silencieux */ }
}

function afficherFormulaireAvis(vendeurId, contexte) {
  var titre       = contexte ? contexte.titre       : 'Laisser un avis';
  var placeholder = contexte ? contexte.placeholder : 'Partagez votre expérience…';
  var wrap = document.getElementById('avis-form-wrap');
  wrap.innerHTML = '<div class="avis-form">'
    + '<div class="avis-form-title">' + titre + '</div>'
    + '<div class="star-picker" id="star-picker">'
    + '<span onclick="setNote(1)" onmouseover="hoverNote(1)" onmouseout="resetHover()">★</span>'
    + '<span onclick="setNote(2)" onmouseover="hoverNote(2)" onmouseout="resetHover()">★</span>'
    + '<span onclick="setNote(3)" onmouseover="hoverNote(3)" onmouseout="resetHover()">★</span>'
    + '<span onclick="setNote(4)" onmouseover="hoverNote(4)" onmouseout="resetHover()">★</span>'
    + '<span onclick="setNote(5)" onmouseover="hoverNote(5)" onmouseout="resetHover()">★</span>'
    + '</div>'
    + '<div class="form-group">'
    + '<textarea id="avis-commentaire" placeholder="' + placeholder + '" style="min-height:80px;"></textarea>'
    + '</div>'
    + '<div id="avis-error" class="form-error" style="display:none;margin-bottom:0.8rem;"></div>'
    + '<button class="btn btn-primary btn-sm" onclick="envoyerAvis(' + vendeurId + ')">Publier l\'avis</button>'
    + '</div>';
}

function hoverNote(n) {
  document.querySelectorAll('#star-picker span').forEach(function(s, i) {
    s.style.color = i < n ? '#f59e0b' : 'var(--border2)';
  });
}
function resetHover() {
  document.querySelectorAll('#star-picker span').forEach(function(s, i) {
    s.style.color = i < _noteSelectionnee ? '#f59e0b' : 'var(--border2)';
  });
}
function setNote(n) {
  _noteSelectionnee = n;
  resetHover();
}

async function envoyerAvis(vendeurId) {
  var errEl = document.getElementById('avis-error');
  errEl.style.display = 'none';

  if (!_noteSelectionnee) {
    errEl.textContent = 'Veuillez sélectionner une note.';
    errEl.style.display = 'block';
    return;
  }
  var commentaire = document.getElementById('avis-commentaire').value.trim();

  try {
    var res = await fetch(API + '/avis/' + vendeurId, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ note: _noteSelectionnee, commentaire }),
    });
    var data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || 'Erreur lors de l\'envoi.';
      errEl.style.display = 'block';
      return;
    }
    document.getElementById('avis-form-wrap').innerHTML = '<div style="font-size:13px;color:var(--green);padding:0.5rem 0;">Avis publié, merci !</div>';
    await chargerAvis(vendeurId);
  } catch {
    errEl.textContent = 'Impossible de contacter le serveur.';
    errEl.style.display = 'block';
  }
}
</script>
</body>
</html>
