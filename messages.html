<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Kaer Seller</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.messages-layout {
  display: grid;
  grid-template-columns: 300px 1fr;
  height: calc(100vh - 64px);
  overflow: hidden;
}

/* CONVERSATIONS LIST */
.conv-list {
  border-right: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.conv-list-header {
  padding: 1rem 1.2rem;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-serif);
  font-size: 1.1rem;
  color: var(--text);
  flex-shrink: 0;
}

.conv-search {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.conv-search input {
  padding: 8px 12px;
  font-size: 13px;
  background: var(--surface2);
  border-radius: var(--radius);
}

.conv-items {
  overflow-y: auto;
  flex: 1;
}

.conv-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 1.2rem;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}
.conv-item:hover { background: var(--surface2); }
.conv-item.active { background: var(--brown-pale); }

.conv-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--surface3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--brown);
  flex-shrink: 0;
}

.conv-info { flex: 1; min-width: 0; }
.conv-name {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}
.conv-preview {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.conv-product {
  font-size: 11px;
  color: var(--brown);
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.conv-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}
.conv-time { font-size: 11px; color: var(--muted); }
.conv-badge {
  background: var(--brown);
  color: #fff;
  border-radius: var(--radius-full);
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  min-width: 18px;
  text-align: center;
}

.conv-empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--muted);
  font-size: 13px;
}

/* THREAD */
.thread {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

.thread-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  gap: 0.8rem;
}
.thread-empty-icon { font-size: 2.5rem; }
.thread-empty-text { font-size: 14px; }

.thread-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.9rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.thread-header-name {
  font-weight: 600;
  font-size: 15px;
  color: var(--text);
}
.thread-header-product {
  font-size: 12px;
  color: var(--brown);
  margin-top: 1px;
}

.thread-messages {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg-row {
  display: flex;
  gap: 8px;
  max-width: 75%;
}
.msg-row.mine { align-self: flex-end; flex-direction: row-reverse; }

.msg-bubble {
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.5;
  max-width: 100%;
}
.msg-row:not(.mine) .msg-bubble {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-bottom-left-radius: 4px;
}
.msg-row.mine .msg-bubble {
  background: var(--brown);
  color: #fff;
  border-bottom-right-radius: 4px;
}

.msg-time {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
  text-align: right;
}
.msg-row:not(.mine) .msg-time { text-align: left; }

.msg-product-ref {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--brown-pale);
  border: 1px solid rgba(124,79,42,.15);
  border-radius: var(--radius-sm);
  padding: 4px 10px;
  font-size: 12px;
  color: var(--brown);
  margin-bottom: 0.5rem;
  align-self: flex-start;
}

/* COMPOSE */
.thread-compose {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 1rem 1.5rem;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-shrink: 0;
}

.thread-compose textarea {
  flex: 1;
  min-height: 44px;
  max-height: 140px;
  resize: none;
  padding: 10px 14px;
  font-size: 14px;
  border-radius: var(--radius);
  line-height: 1.5;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .messages-layout { grid-template-columns: 1fr; }
  .conv-list { display: none; }
  .conv-list.mobile-show { display: flex; position: fixed; inset: 64px 0 0 0; z-index: 100; }
  .thread-header-back { display: flex !important; }
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="navbar-logo" href="marketplace.html">
    <span class="navbar-logo-icon">⬡</span>
    Kaer Seller
  </a>
  <div class="navbar-nav">
    <a class="nav-link" href="marketplace.html">Catalogue</a>
    <a class="nav-link" href="mes-achats.html">Mes achats</a>
    <a class="nav-link" href="mes-annonces.html">Mes annonces</a>
    <a class="nav-link active" href="messages.html">Messages</a>
  </div>
  <div class="navbar-actions">
    <div class="navbar-search">
      <svg class="navbar-search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="13" y1="13" x2="18" y2="18"/></svg>
      <input type="search" placeholder="Rechercher un produit…">
    </div>
    <div class="avatar-wrap">
      <div class="avatar" id="nav-avatar" onclick="toggleDropdown()" style="cursor:pointer"></div>
      <div class="avatar-dropdown" id="avatar-dropdown">
        <div class="avatar-dropdown-header">
          <span class="avatar-dropdown-name" id="dd-name"></span>
          <span class="avatar-dropdown-email" id="dd-email"></span>
        </div>
        <a class="avatar-dropdown-item" href="#">👤 Mon profil</a>
        <a class="avatar-dropdown-item" href="#">📋 Mes annonces</a>
        <div class="avatar-dropdown-sep"></div>
        <button class="avatar-dropdown-item danger" onclick="logout()">↩ Se déconnecter</button>
      </div>
    </div>
  </div>
  <button class="hamburger" onclick="toggleMobileNav()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="mobile-nav" id="mobile-nav">
  <a class="nav-link" href="marketplace.html">Catalogue</a>
  <a class="nav-link" href="#">Mes achats</a>
  <a class="nav-link" href="#">Mes annonces</a>
  <a class="nav-link active" href="messages.html">Messages</a>
</div>

<!-- LAYOUT -->
<div class="messages-layout">

  <!-- LISTE CONVERSATIONS -->
  <div class="conv-list" id="conv-list">
    <div class="conv-list-header">Messages</div>
    <div class="conv-search">
      <input type="search" placeholder="Rechercher une conversation…" id="conv-search" oninput="filtrerConv()">
    </div>
    <div class="conv-items" id="conv-items">
      <div class="conv-empty">Chargement…</div>
    </div>
  </div>

  <!-- THREAD -->
  <div class="thread" id="thread">
    <div class="thread-empty" id="thread-empty">
      <div class="thread-empty-icon">💬</div>
      <div class="thread-empty-text">Sélectionnez une conversation</div>
    </div>

    <div id="thread-content" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
      <div class="thread-header">
        <button class="btn btn-ghost btn-sm" id="thread-header-back" style="display:none;" onclick="backToList()">←</button>
        <div class="conv-avatar" id="thread-avatar"></div>
        <div>
          <div class="thread-header-name" id="thread-name"></div>
          <div class="thread-header-product" id="thread-product"></div>
        </div>
      </div>
      <div class="thread-messages" id="thread-messages"></div>
      <div class="thread-compose">
        <textarea id="compose-input" placeholder="Écrivez votre message…" rows="1"
          onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); envoyer(); }"
          oninput="this.style.height='auto'; this.style.height=this.scrollHeight+'px'"></textarea>
        <button class="btn btn-primary" onclick="envoyer()">Envoyer</button>
      </div>
    </div>
  </div>

</div>

<script src="auth-guard.js"></script>
<script>
var moi = null;
var convActive = null;
var convData = [];

(async function() {
  const user = await requireAuth();
  moi = user;
  await initNav(user);
  await chargerConversations();

  // Si on arrive depuis une fiche produit avec ?to=X&produit=Y
  var params = new URLSearchParams(window.location.search);
  var toId   = params.get('to');
  var prodId = params.get('produit');
  if (toId) ouvrirThread(parseInt(toId), null, prodId ? parseInt(prodId) : null);
})();

function toggleMobileNav() {
  document.getElementById('mobile-nav').classList.toggle('open');
}

// ===== CONVERSATIONS =====
async function chargerConversations() {
  try {
    var res  = await fetch(API + '/messages', { credentials: 'include' });
    convData = await res.json();
    renderConversations(convData);
  } catch {
    document.getElementById('conv-items').innerHTML = '<div class="conv-empty">Erreur de chargement.</div>';
  }
}

function renderConversations(liste) {
  var el = document.getElementById('conv-items');
  if (!liste.length) {
    el.innerHTML = '<div class="conv-empty">Aucune conversation pour l\'instant.</div>';
    return;
  }
  el.innerHTML = liste.map(function(c) {
    var autreId   = c.from_id === moi.id ? c.to_id : c.from_id;
    var initiales = c.raison_sociale.split(' ').slice(0, 2).map(function(w) { return w[0].toUpperCase(); }).join('');
    var heure     = new Date(c.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    return '<div class="conv-item" onclick="ouvrirThread(' + autreId + ', \'' + escHtml(c.raison_sociale) + '\', ' + (c.produit_id || 'null') + ')">'
      + '<div class="conv-avatar">' + initiales + '</div>'
      + '<div class="conv-info">'
      + (c.produit_titre ? '<div class="conv-product">📦 ' + escHtml(c.produit_titre) + '</div>' : '')
      + '<div class="conv-name">' + escHtml(c.raison_sociale) + '</div>'
      + '<div class="conv-preview">' + escHtml(c.contenu.substring(0, 60)) + '</div>'
      + '</div>'
      + '<div class="conv-meta">'
      + '<div class="conv-time">' + heure + '</div>'
      + (c.non_lus > 0 ? '<div class="conv-badge">' + c.non_lus + '</div>' : '')
      + '</div>'
      + '</div>';
  }).join('');
}

function filtrerConv() {
  var q = document.getElementById('conv-search').value.toLowerCase();
  renderConversations(convData.filter(function(c) {
    return c.raison_sociale.toLowerCase().includes(q);
  }));
}

// ===== THREAD =====
async function ouvrirThread(userId, nom, produitId) {
  convActive = { userId: userId, produitId: produitId };

  document.getElementById('thread-empty').style.display   = 'none';
  document.getElementById('thread-content').style.display = 'flex';

  // Si le nom est inconnu, le récupérer depuis le produit
  if (!nom && produitId) {
    try {
      var r = await fetch(API + '/produits/' + produitId, { credentials: 'include' });
      var p = await r.json();
      nom = p.raison_sociale;
    } catch {}
  }

  if (nom) {
    var initiales = nom.split(' ').slice(0, 2).map(function(w) { return w[0].toUpperCase(); }).join('');
    document.getElementById('thread-avatar').textContent = initiales;
    document.getElementById('thread-name').textContent   = nom;
  }

  await chargerMessages(userId, produitId);
}

async function chargerMessages(userId, produitId) {
  var el = document.getElementById('thread-messages');
  el.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:13px;padding:2rem;">Chargement…</div>';

  try {
    var res  = await fetch(API + '/messages/' + userId, { credentials: 'include' });
    var msgs = await res.json();

    if (!msgs.length) {
      el.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:13px;padding:2rem;">Aucun message — commencez la conversation !</div>';

      // Affiche la référence produit si premier contact
      if (produitId) {
        var ref = document.createElement('div');
        ref.className = 'msg-product-ref';
        ref.innerHTML = '📦 <span id="thread-product-label">Produit #' + produitId + '</span>';
        el.prepend(ref);
        // Charger le titre
        fetch(API + '/produits/' + produitId, { credentials: 'include' })
          .then(function(r) { return r.json(); })
          .then(function(p) {
            document.getElementById('thread-product-label').textContent = p.titre;
            document.getElementById('thread-product').textContent = '📦 ' + p.titre;
          });
      }
      return;
    }

    // Référence produit en tête de thread
    var premierProduitId = msgs.find(function(m) { return m.produit_id; });
    var prodRef = '';
    if (premierProduitId) {
      prodRef = '<div class="msg-product-ref">📦 ' + escHtml(premierProduitId.produit_titre || 'Produit') + '</div>';
      document.getElementById('thread-product').textContent = '📦 ' + (premierProduitId.produit_titre || '');
    }

    el.innerHTML = prodRef + msgs.map(function(m) {
      var mine  = m.from_id === moi.id;
      var heure = new Date(m.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      return '<div class="msg-row' + (mine ? ' mine' : '') + '">'
        + '<div><div class="msg-bubble">' + escHtml(m.contenu) + '</div>'
        + '<div class="msg-time">' + heure + '</div></div>'
        + '</div>';
    }).join('');

    el.scrollTop = el.scrollHeight;
  } catch {
    el.innerHTML = '<div style="text-align:center;color:#b91c1c;font-size:13px;padding:2rem;">Erreur de chargement.</div>';
  }
}

// ===== ENVOI =====
async function envoyer() {
  if (!convActive) return;
  var input  = document.getElementById('compose-input');
  var contenu = input.value.trim();
  if (!contenu) return;

  input.value = '';
  input.style.height = 'auto';

  try {
    var res = await fetch(API + '/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ to_id: convActive.userId, contenu: contenu, produit_id: convActive.produitId }),
    });
    var msg = await res.json();
    if (!res.ok) return;

    var heure = new Date(msg.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    var el    = document.getElementById('thread-messages');
    var div   = document.createElement('div');
    div.className = 'msg-row mine';
    div.innerHTML = '<div><div class="msg-bubble">' + escHtml(msg.contenu) + '</div>'
      + '<div class="msg-time">' + heure + '</div></div>';
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;

    // Refresh la liste des conversations
    chargerConversations();
  } catch {
    alert('Erreur lors de l\'envoi.');
  }
}

function backToList() {
  document.getElementById('thread-empty').style.display   = 'flex';
  document.getElementById('thread-content').style.display = 'none';
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
