<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes achats — Kaer Seller</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.page-header {
  background: var(--green);
  padding: clamp(1.5rem, 4vw, 2.5rem) clamp(1rem, 4vw, 3rem);
}
.page-header h1 {
  font-family: var(--font-serif);
  font-size: clamp(1.4rem, 3vw, 2rem);
  color: #fff;
  margin-bottom: 0.3rem;
}
.page-header p { font-size: 14px; color: rgba(255,255,255,.65); }

.achats-body {
  max-width: 900px;
  margin: 0 auto;
  padding: clamp(1.5rem, 4vw, 2.5rem) clamp(1rem, 4vw, 2rem);
}

.achat-card {
  display: flex;
  gap: 1.2rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.2rem;
  margin-bottom: 1rem;
  transition: box-shadow .15s;
}
.achat-card:hover { box-shadow: var(--shadow-md); }
.achat-img {
  width: 110px;
  height: 90px;
  border-radius: var(--radius);
  object-fit: cover;
  flex-shrink: 0;
  background: var(--bg);
}
.achat-img-placeholder {
  width: 110px;
  height: 90px;
  border-radius: var(--radius);
  background: var(--bg);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  flex-shrink: 0;
  color: var(--muted);
}
.achat-info { flex: 1; min-width: 0; }
.achat-titre {
  font-family: var(--font-serif);
  font-size: 1.05rem;
  color: var(--text);
  margin-bottom: 0.3rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.achat-meta { font-size: 13px; color: var(--muted); margin-bottom: 0.5rem; }
.achat-meta span { margin-right: 1rem; }
.achat-prix { font-size: 1rem; font-weight: 600; color: var(--green); }
.achat-vendeur { font-size: 13px; color: var(--muted); margin-top: 0.4rem; }
.achat-vendeur a { color: var(--green); text-decoration: none; }
.achat-vendeur a:hover { text-decoration: underline; }
.achat-actions {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  justify-content: center;
  align-items: flex-end;
  flex-shrink: 0;
}
.empty-state {
  text-align: center;
  padding: 5rem 2rem;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.empty-icon { font-size: 3rem; margin-bottom: 1.2rem; }
.empty-title { font-family: var(--font-serif); font-size: 1.4rem; color: var(--text); margin-bottom: 0.6rem; }
.empty-text { font-size: 14px; line-height: 1.7; max-width: 400px; margin: 0 auto 2rem; }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="navbar-logo" href="marketplace.html">
    <span class="navbar-logo-icon">⬡</span>
    Kaer Seller
  </a>
  <div class="navbar-nav">
    <a class="nav-link" href="marketplace.html">Catalogue</a>
    <a class="nav-link active" href="mes-achats.html">Mes achats</a>
    <a class="nav-link" href="mes-annonces.html">Mes annonces</a>
    <span class="nav-link-wrap"><a class="nav-link" href="messages.html">Messages</a><span class="nav-badge" id="msg-badge"></span></span>
  </div>
  <div class="navbar-actions">
    <div class="navbar-search">
      <svg class="navbar-search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="13" y1="13" x2="18" y2="18"/></svg>
      <input type="search" placeholder="Rechercher un produit…">
    </div>
    <a href="publier.html" class="btn btn-ghost btn-sm">+ Publier</a>
    <div class="avatar-wrap">
      <div class="avatar" id="nav-avatar" onclick="toggleDropdown()" style="cursor:pointer"></div>
      <div class="avatar-dropdown" id="avatar-dropdown">
        <div class="avatar-dropdown-header">
          <span class="avatar-dropdown-name" id="dd-name"></span>
          <span class="avatar-dropdown-email" id="dd-email"></span>
        </div>
        <a class="avatar-dropdown-item" href="profil.html">👤 Mon profil</a>
        <a class="avatar-dropdown-item" href="mes-annonces.html">📋 Mes annonces</a>
        <a class="avatar-dropdown-item" href="favoris.html">🤍 Favoris</a>
        <div class="avatar-dropdown-sep"></div>
        <button class="avatar-dropdown-item danger" onclick="logout()">↩ Se déconnecter</button>
      </div>
    </div>
  </div>
  <button class="hamburger" onclick="toggleMobileNav()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="mobile-nav" id="mobile-nav">
  <a class="nav-link" href="marketplace.html">Catalogue</a>
  <a class="nav-link active" href="mes-achats.html">Mes achats</a>
  <a class="nav-link" href="mes-annonces.html">Mes annonces</a>
  <a class="nav-link" href="messages.html">Messages</a>
</div>

<div class="page-header">
  <h1>Mes achats</h1>
  <p>Retrouvez ici l'historique de vos transactions.</p>
</div>

<div class="achats-body">
  <div id="loading-achats" style="text-align:center;padding:3rem;color:var(--muted);font-size:14px;">Chargement…</div>
  <div id="liste-achats"></div>
</div>

<script src="auth-guard.js"></script>
<script>
(async function() {
  var user = await requireAuth();
  await initNav(user);
  await chargerAchats();
})();

function toggleMobileNav() {
  document.getElementById('mobile-nav').classList.toggle('open');
}

async function chargerAchats() {
  var loading = document.getElementById('loading-achats');
  var liste = document.getElementById('liste-achats');
  try {
    var res = await fetch(API + '/transactions/achats', { credentials: 'include' });
    var achats = await res.json();
    loading.style.display = 'none';

    if (!achats.length) {
      liste.innerHTML = '<div class="empty-state"><div class="empty-icon">🛒</div><div class="empty-title">Aucun achat pour le moment</div><div class="empty-text">Vous n\'avez pas encore effectué d\'achat. Parcourez le catalogue pour trouver votre bonheur.</div><a href="marketplace.html" class="btn btn-primary">Parcourir le catalogue</a></div>';
      return;
    }

    liste.innerHTML = achats.map(function(a) {
      var images = [];
      try { images = JSON.parse(a.images) || []; } catch(e) {}
      var imgHtml = images[0]
        ? '<img class="achat-img" src="/uploads/' + escHtml(images[0]) + '" alt="">'
        : '<div class="achat-img-placeholder">📦</div>';

      var date = new Date(a.achat_date).toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
      var prix = parseFloat(a.prix_ht).toLocaleString('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + ' € HT';

      return '<div class="achat-card">' +
        '<a href="product.html?id=' + a.id + '">' + imgHtml + '</a>' +
        '<div class="achat-info">' +
          '<div class="achat-titre">' + escHtml(a.titre) + '</div>' +
          '<div class="achat-meta">' +
            '<span>' + escHtml(a.categorie) + '</span>' +
            '<span>' + escHtml(a.etat) + '</span>' +
            '<span>Acheté le ' + date + '</span>' +
          '</div>' +
          '<div class="achat-prix">' + prix + '</div>' +
          '<div class="achat-vendeur">Vendu par <a href="profil-vendeur.html?id=' + a.vendeur_id + '">' + escHtml(a.vendeur_nom) + '</a></div>' +
        '</div>' +
        '<div class="achat-actions">' +
          '<a href="product.html?id=' + a.id + '" class="btn btn-ghost btn-sm">Voir l\'annonce</a>' +
          '<a href="messages.html?user=' + a.vendeur_id + '" class="btn btn-ghost btn-sm">Contacter</a>' +
        '</div>' +
      '</div>';
    }).join('');
  } catch(err) {
    console.error('chargerAchats:', err);
    loading.textContent = 'Erreur lors du chargement.';
  }
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
